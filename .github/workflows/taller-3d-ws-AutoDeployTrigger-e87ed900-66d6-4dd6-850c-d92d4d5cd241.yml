name: Trigger auto deployment for taller-3d-ws

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/taller-3d-ws-AutoDeployTrigger-e87ed900-66d6-4dd6-850c-d92d4d5cd241.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TALLER3DWS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TALLER3DWS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TALLER3DWS_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}server
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: taller3dws.azurecr.io
          registryUsername: ${{ secrets.TALLER3DWS_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.TALLER3DWS_REGISTRY_PASSWORD }}
          containerAppName: taller-3d-ws
          resourceGroup: azure-signup-rg
          imageToBuild: taller3dws.azurecr.io/taller-3d-ws:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


